server.port= 8099
dubbo.application.name = kano-project-controller
# 与 provider 使用同一 ZK，否则 @Reference 发现不了 Dubbo 服务（provider 配置为 101.132.187.120:2181）
dubbo.registry.address=zookeeper://101.132.187.120:2181
dubbo.consumer.timeout=50000
# Dubbo QoS 端口：本地与 provider（默认 22222）并存时需错开
dubbo.application.qos-enable=true
dubbo.application.qos-port=22223

spring.servlet.multipart.max-file-size = 100MB
spring.servlet.multipart.max-request-size = 150MB


##########抽取病例比例##############   当前总数据量抽取比例为6%，后续抽取总量变动需要对下面的百分比数值动态调整
qualified.get.percent = 0.07


#微信小程序登录（留空进入开发模式，本地联调可用；正式需填小程序 AppID 与密钥）
wechat.appid =
wechat.secret =
wechat.jscode2session.url = https://api.weixin.qq.com/sns/jscode2session


#springboot 日志
logging.level.root = info
logging.file.name=controller.log